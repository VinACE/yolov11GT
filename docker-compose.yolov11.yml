services:
  yolov11:
    build:
      context: .
      dockerfile: Dockerfile.yolov11
    container_name: yolov11-cpu
    depends_on:
      - mongo
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./src:/app/src
      - ./scripts:/app/scripts
    ports:
      - "8001:8000"
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - YOLO_VERBOSE=True
      - USE_MONGO=1
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=yolov11
      - FRAME_PROCESS_EVERY=15
      - VISITOR_TIMEOUT_SECONDS=15
      # ReID Matching Parameters (Hybrid: gtdevvin frame rate + gtvin tuning)
      # Using FRAME_PROCESS_EVERY=15 for better tracking continuity (was 24)
      # Using optimized threshold from gtvin extensive tuning
      # Using OSNet for speed (30-50ms) - FastREID too slow (100-150ms)
      # OPTIMIZED FOR HYBRID REID: More lenient matching for better accuracy
      - REID_SIM_THRESHOLD=0.60
      - REID_RERANK_ALPHA=0.30
      - REID_RERANK_MARGIN=0.025
      - FEATURE_AVG_WINDOW=11
      - MIN_CROP_HEIGHT=140
      - SAME_CAM_CONTINUITY_SECONDS=12
      - REID_TOPK=6
      - REID_GALLERY_TTL_SECONDS=3600
      - REID_EMA_MOMENTUM=0.88
      # Cross-Camera Handoff (more lenient)
      - HANDOFF_WINDOW_SECONDS=10
      - HANDOFF_MARGIN=0.04
      # Gender Classification (improves ReID accuracy by filtering cross-gender matches)
      # Uses lightweight OpenCV DNN model (~44MB, ~5-10ms inference)
      - GENDER_CLASSIFICATION_ENABLED=1
      # Hybrid ReID (FaceNet + OSNet) - RECOMMENDED for best speed + accuracy
      # Uses FaceNet when face visible (10-30ms, 99% accurate) + OSNet fallback (30-50ms)
      # Expected: 95-98% accuracy, avg 26ms per person (vs OSNet alone: 82-91%, 40ms)
      - USE_HYBRID_REID=1
      # FastReID Configuration (MSMT17 R50 or Market1501 R50)
      # ✅ Python 3.11 compatible with compatibility shim in fastreid_embedder.py
      # MSMT17: Better cross-domain generalization (294MB, 2048-dim)
      # Market1501: Retail-focused (288MB, 2048-dim)
      # NOTE: FastREID is slow on CPU (~100-150ms/person) - too slow for real-time
      # Keeping OSNet for speed (30-50ms) - see SPEED_VS_ACCURACY_MODELS.md for alternatives
      - FASTREID_ENABLED=0
      # Switch between: msmt17_r50 or market1501_r50
      - FASTREID_PRESET=msmt17_r50
      # OSNet fallback config (unused when FastReID enabled)
      - TORCHREID_MODEL_NAME=osnet_x0_75
      - TORCHREID_IMAGE_SIZE=256x128
      - TORCHREID_PIXEL_MEAN=0.485,0.456,0.406
      - TORCHREID_PIXEL_STD=0.229,0.224,0.225
    command: tail -f /dev/null
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G  # Increased for Hybrid (FaceNet + OSNet models)
        reservations:
          cpus: '1.0'
          memory: 1G
 
 
  yolov11-jupyter:
    build:
      context: .
      dockerfile: Dockerfile.yolov11
    container_name: yolov11-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONUNBUFFERED=1
      - JUPYTER_ENABLE_LAB=yes
    command: >
      bash -c "pip install jupyter jupyterlab &&
               jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''"
    profiles:
      - jupyter

  yolov11-reset:
    build:
      context: .
      dockerfile: Dockerfile.yolov11
    container_name: yolov11-reset
    depends_on:
      - yolov11
    volumes:
      - ./scripts:/app/scripts
    environment:
      - ANALYTICS_API_BASE=http://yolov11-cpu:8000
      - TZ=Asia/Kolkata
    command: >
      bash -lc "python /app/scripts/scheduler_reset.py"
    restart: unless-stopped
 
  mongo:
    image: mongo:8
    container_name: yolov11-mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - ./mongo_data:/data/db
