services:
  yolov11:
    build:
      context: .
      dockerfile: Dockerfile.yolov11
    container_name: yolov11-cpu
    depends_on:
      - mongo
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./src:/app/src
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - YOLO_VERBOSE=True
      - USE_MONGO=1
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=yolov11
      - FRAME_PROCESS_EVERY=5
      - VISITOR_TIMEOUT_SECONDS=15
      - REID_SIM_THRESHOLD=0.72
      - REID_RERANK_ALPHA=0.45
      - REID_RERANK_MARGIN=0.05
      - FEATURE_AVG_WINDOW=7
      - MIN_CROP_HEIGHT=140
      - SAME_CAM_CONTINUITY_SECONDS=10
      - REID_TOPK=5
      - REID_GALLERY_TTL_SECONDS=120
      - REID_EMA_MOMENTUM=0.9
      - HANDOFF_WINDOW_SECONDS=5
      - HANDOFF_MARGIN=0.03
      - FASTREID_ENABLED=1
      # FastReID model selection
      # Option A: presets (msmt17_r50, market1501_r50)
      - FASTREID_PRESET=msmt17_r50
      # Option B: explicit paths (override preset if set)
      # - FASTREID_CONFIG=/app/models/fast-reid-configs/msmt17/bagtricks_R50.yml
      # - FASTREID_WEIGHTS=/app/models/fast-reid-weights/msmt17/bagtricks_R50.pth
      - TORCHREID_MODEL_NAME=osnet_x0_75
      - TORCHREID_IMAGE_SIZE=256x128
      - TORCHREID_PIXEL_MEAN=0.485,0.456,0.406
      - TORCHREID_PIXEL_STD=0.229,0.224,0.225
      - HANDOFF_WINDOW_SECONDS=8
      - HANDOFF_MARGIN=0.03
    command: tail -f /dev/null
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
 
 
  yolov11-jupyter:
    build:
      context: .
      dockerfile: Dockerfile.yolov11
    container_name: yolov11-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONUNBUFFERED=1
      - JUPYTER_ENABLE_LAB=yes
    command: >
      bash -c "pip install jupyter jupyterlab &&
               jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''"
    profiles:
      - jupyter

  yolov11-reset:
    build:
      context: .
      dockerfile: Dockerfile.yolov11
    container_name: yolov11-reset
    depends_on:
      - yolov11
    volumes:
      - ./scripts:/app/scripts
    environment:
      - ANALYTICS_API_BASE=http://yolov11-cpu:8000
      - TZ=Asia/Kolkata
    command: >
      bash -lc "python /app/scripts/scheduler_reset.py"
    restart: unless-stopped
 
  mongo:
    image: mongo:6
    container_name: yolov11-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
